[project]
name = "zan-protect-bot"
version = "0.2.0"
description = "Kazakhstan anti-fraud Telegram assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "aiogram>=3.15,<4",
  "openai>=2,<3", "pydantic-settings>=2.6,<3", "asyncpg>=0.30,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "python-pptx>=1,<2",
  "openpyxl>=3.1,<4", "Pillow>=11,<13", "tzdata>=2025.1",
  "reportlab>=4.2,<5", "cryptography>=44,<48", "pypdfium2>=4.30,<6",
  "pytesseract>=0.3.13,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.28,<1", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.setuptools.packages.find]
include = ["app*"]
